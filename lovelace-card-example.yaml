type: grid
cards:
  - type: heading
    heading_style: subtitle
    heading: "Air Health"
    icon: mdi:medication
    badges:
      - type: entity
        show_state: true
        show_icon: true
        entity: sensor.airhealth_grass_day0
        state_content: level_icon
      - type: entity
        show_state: true
        show_icon: false
        entity: sensor.airhealth_grass_day1
        state_content: level_icon
      - type: entity
        show_state: true
        show_icon: false
        entity: sensor.airhealth_grass_day2
        state_content: level_icon
      - type: entity
        show_state: true
        show_icon: true
        entity: sensor.airhealth_other_allergens_day0
        state_content: level_icon
      - type: entity
        show_state: true
        show_icon: false
        entity: sensor.airhealth_other_allergens_day1
        state_content: level_icon
      - type: entity
        show_state: true
        show_icon: false
        entity: sensor.airhealth_other_allergens_day2
        state_content: level_icon
    grid_options:
      columns: 12
      rows: auto
  - type: tile
    entity: sensor.airhealth_grass_day0
    name: Grass
    color: disabled
    state_content:
      - level_icon
      - state
    vertical: false
    features_position: bottom
  - type: tile
    entity: sensor.airhealth_other_allergens_day0
    name: Allergens
    color: disabled
    state_content:
      - level_icon
      - state
    vertical: false
    features_position: bottom
  - type: tile
    entity: sensor.airhealth_woodsmoke_day0
    name: Wood Smoke
    color: disabled
    state_content:
      - level_icon
      - state
    vertical: false
    features_position: bottom
  - type: tile
    entity: sensor.airhealth_air_quality_day0
    name: Air Quality
    color: disabled
    state_content:
      - level_icon
      - state
    vertical: false
    features_position: bottom
column_span: 1
